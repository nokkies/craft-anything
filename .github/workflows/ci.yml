name: CI

# Quality gates for every push to main and every pull request, through the suite's shared gate
# workflow in craft-common-actions. The shared workflow is SHA-pinned so a change there can't
# silently change what this repository runs; bump the pin deliberately.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@44a7db40b1a3e99eed02c88f89f38cdd6cfffe81
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      command: |
        cargo xtask ci
        cargo deny check advisories

  # The path, process and parser layers must also pass on the desktop platforms people use, not
  # only Linux. This is a targeted test leg (the full gate above stays on Ubuntu).
  portable:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@44a7db40b1a3e99eed02c88f89f38cdd6cfffe81
    with:
      os: '["windows-latest", "macos-latest"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      require-craft-fonts: false
      packages: ""
      tools: ""
      command: |
        cargo test -p craft-anything-platform -p craft-anything-engine -p craft-anything-formats --locked
